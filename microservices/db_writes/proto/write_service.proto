syntax = "proto3";
import "google/protobuf/timestamp.proto";

enum Genre {
    DNB = 0;
    EDM = 1;
    HOUSE = 2;
    TECHNO = 3;
    REGGAETON = 4;
    AFRO_HOUSE = 5;
    DEEP_HOUSE = 6;
}

message EventData {
  int32 org_id = 1;
  int32 venue_id = 2;
  bool published = 3;
  bool tagged_bool = 4;
  string name = 5;
  google.protobuf.Timestamp date = 6;
  float budget = 7;
  optional string pre_event_poster = 8;
  optional string pre_bio = 9;
  repeated Genre genres = 10;
}

message CreateEventRequest {
  EventData data = 1;
}


enum Gender {
    Male = 0;
    Female = 1;
    Other = 2;
}

enum SpendClass {
    A = 0;
    B = 1;
    C = 2;
    D = 3;
    E = 4;
    NA = 5;
}


message UserData {
  string username = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string location = 5;
  string language = 6;
  Gender gender = 7;
  string birthdate = 12;
  optional SpendClass spend_class = 9;
  bool music_service = 10;
  string pw = 11;
  repeated Genre genres = 13;
}

message CreateUserRequest {
  UserData data = 1;
}


message Socials {
    optional string website = 1;
    optional string soundcloud = 2;
    optional string spotify = 3;
    optional string facebook = 4;
    optional string instagram = 5;
    optional string snapchat = 6;
    optional string x = 7;
}

message DJData {
    string dj_name = 1;
    string first_name = 2;
    string last_name = 3;
    string email = 4;
    string location = 5;
    string language = 6;
    Gender gender = 7;
    string birthdate = 8;
    string pw = 9;
    string bio = 10;
    string phone = 11;
    repeated Genre genres = 12;
    Socials social_data = 13;
}

message CreateDJRequest {
    DJData data = 1;
}


message VenueData {
  string venue_name = 1;
  int64 venue_capacity = 2;
  string venue_address = 3;
  string venue_city = 4;
  string venue_state = 5;
  string venue_zip = 6;
  string venue_country = 7;
  int32 table_count = 8;
  string first_name = 9;
  string last_name = 10;
  string email = 11;
  string language = 12;
  Gender gender = 13;
  string birthdate = 14;
  string pw = 15;
  repeated string venue_types = 16;
}

message CreateVenueRequest {
  VenueData data = 1;
}

message OrganizerData {
  string org_name = 1;
  string phone = 5;
  string country = 6;
  string website = 7;
  string first_name = 8;
  string last_name = 9;
  string email = 10;
  string language = 11;
  Gender gender = 12;
  string birthdate = 13;
  string pw = 14;
}

message CreateOrganizerRequest {
  OrganizerData data = 1;
}

message PublishData {
  int32 event_id = 1;
  int32 dj_id = 2;
  string event_poster = 3;
  string bio = 4;
}

message CreatePublishRequest {
  PublishData data = 1;
}

message DjEventData {
  int32 event_id = 1;
  int32 dj_id = 2;
}

message CreateDjEventRequest {
  DjEventData data = 1;
}

message DeleteEventData {
  int32 event_id = 1;
  int32 organizer_id = 2;
}

message DeleteEventRequest {
  DeleteEventData data = 1;
}

service WriteService {
  rpc CreateEvent(CreateEventRequest) returns (CreateEntityResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateEntityResponse);
  rpc CreateDj(CreateDJRequest) returns (CreateEntityResponse);
  rpc CreateVenue(CreateVenueRequest) returns (CreateEntityResponse);
  rpc CreateOrganizer(CreateOrganizerRequest) returns (CreateEntityResponse);
  rpc PublishEvent(CreatePublishRequest) returns (CreateEntityResponse);
  rpc AddDjEvent(CreateDjEventRequest) returns (CreateEntityResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (CreateEntityResponse);

}

message CreateEntityResponse {
  bool success = 1;
  string message = 2;
}